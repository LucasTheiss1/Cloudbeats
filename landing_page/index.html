<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CloudBeats</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Font Awesome -->
  <link 
    rel="stylesheet" 
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  />
  <!-- Bootstrap CSS -->
  <link 
  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
  rel="stylesheet">
  <!-- Custom CSS -->
  <link href="assets/css/style.css" rel="stylesheet">

</head>

<body>
  <header>
    
  </header>

  <main>
    <!--Hero section-->
    <section class="hero">
      <div class="logo">
        <i class="fa-brands fa-soundcloud"></i>
        <h1 class="fw-bold">CloudBeats</h1>
        <p>Feel the Music Anywhere</p>
        <div class="player-controls">
          <button class="btn play-live">
            <i class="fa-solid fa-play"></i>
            Play Live
          </button>
          <span class="btn live-button">
            <i class="fa-solid fa-circle"></i>
            Live
          </span>
          <span class="listener"><i class="fa-solid fa-user-group"></i>1,234 listeners</span>
        </div>
      </div>
    </section>
    <!--Now Playing Section-->
    <section class="now-playing-section">
      <div class="playing-card">
        <div class="album-picture">
              <img src="assets/images/88796_Hs6_VyDcqxDfCwQm_44438.jpg" alt="Album Art">
        </div>
        <div class="track-content">
          <h2>Album Title</h2>
          <p id="trackInfo">Tropical Nights</p>
        
          <div class="now-playing" id="nowPlaying">
            <!-- Player de áudio integrado -->
            <div class="player">
              <audio id="radioPlayer" controls preload="none">
                  <source src="http://localhost:8000/stream" type="audio/mpeg">
                  Your browser does not support the audio element.
              </audio>
            </div>
          </div>
        </div>  
      </div>
    </section>
    
  </main>
  <footer>
    <span>&copy; 2024 CloudBeats. All rights reserved.</span>
  </footer>
  <script src="assets/js/script.js"></script>
</body>
</html>
