version: '3.8'

services:
  icecast:
    image: moul/icecast
    container_name: icecast
    ports:
      - "8000:8000"
    volumes:
      - ./icecast_config/icecast.xml:/etc/icecast_config/icecast.xml:ro
    environment:
      - TZ=Europe/London
    restart: unless-stopped

  liquidsoap:
    image: savonet/liquidsoap:rolling-release-v2.3.x
    container_name: liquidsoap
    volumes:
      - ./liquidsoap_test_script:/etc/liquidsoap   # Onde seu script.liq está localizado
      - /mnt/Data/Backup/Music/teste_projct_radio:/media/notebook/Data/Backup/Music/teste_projct_radio                # Diretório com as músicas
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=Europe/London
    depends_on:
      - icecast
    command: liquidsoap /etc/liquidsoap/script.liq
    restart: unless-stopped
    ports:
      - "8080:8080"  # Porta para acessar a interface do Harbor
      - "9000:9000"

  nginx:
    image: nginx:latest
    container_name: nginx_proxy
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d/:/etc/nginx/conf.d/:ro
      - ./landing_page/:/usr/share/nginx/html:ro
    ports:
      - "80:80"
    restart: unless-stopped
